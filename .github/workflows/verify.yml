name: Verify portfolio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-and-models:
    name: App and model checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONWARNINGS: ignore::DeprecationWarning
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-*.txt
      - name: Install app and evaluation dependencies
        run: python -m pip install -r requirements-demo.txt -r requirements-evaluation.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run regression checks
        run: python -m unittest discover -s tests -v
      - name: Reproduce the notebook result
        run: python scripts/reproduce_results.py
      - name: Recreate the app forecasts
        run: python scripts/reproduce_app_forecasts.py

  full-notebook:
    name: Complete notebook (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      PYTHONWARNINGS: ignore::DeprecationWarning
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install the full environment
        run: python -m pip install -r requirements.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Execute every notebook code cell
        run: python scripts/run_notebook.py
